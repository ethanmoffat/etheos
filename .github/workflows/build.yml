name: Build

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
    branches:
      - master
      - 'feat/**'

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }} OS
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux-x64
            deps: sudo ./install-deps.sh
            build: ./build-linux.sh -c --sqlserver ON --mariadb ON --sqlite ON
          - name: windows
            os: windows-2022
            platform: windows-x86
            deps: .\install-deps.ps1 -SkipCMake
            build: .\build-windows.ps1 -Clean -SqlServer ON -MariaDB ON -Sqlite ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install build dependencies
        working-directory: scripts
        run: ${{ matrix.deps }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        working-directory: install/test
        run: ./eoserv_test

      # Archived so file permissions survive the artifact upload; the release workflow repackages it.
      - name: Archive install directory
        shell: bash
        run: tar -czf "install-${{ matrix.platform }}.tar.gz" --exclude=./test -C install .

      - uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.platform }}
          path: install-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Build image
        run: |
          docker build -t etheos:build .
          docker save etheos:build | gzip -1 > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz
          if-no-files-found: error

  ci-test:
    name: CI Test
    needs: docker
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Download sample data
        run: |
          wget -q https://etheosstorage.blob.core.windows.net/data/sample-data.zip
          unzip -q sample-data.zip -d .

      - name: Download EOBot
        uses: robinraju/release-downloader@v1
        with:
          repository: ethanmoffat/EndlessClient
          latest: true
          fileName: EOBot.Linux.zip
          out-file-path: eobot
          extract: true

      - name: Smoke test
        run: |
          docker run --rm -d --name smoketest -v "$(pwd)/sample-data/:/etheos/data" \
            -e ETHEOS_DBTYPE=sqlite -e "ETHEOS_INSTALLSQL=./install.sql" \
            -e ETHEOS_PORT=8078 -p 8078:8078 \
            etheos:build

          sleep 5

          status=$(docker inspect -f '{{.State.Status}}' smoketest 2>/dev/null || echo "exited")
          docker stop smoketest > /dev/null 2>&1 || true
          if [[ "${status}" != "running" ]]; then
            echo "::error::The etheos container isn't running 5 seconds after starting (status: ${status})"
            exit 1
          fi

      - name: Run EOBot integration tests
        run: |
          chmod +x eobot/net8.0/EOBot
          deploy/ci-test.sh --self-contained --botdir eobot/net8.0 --datadir "$(pwd)/sample-data/" \
            --no-pull --image-repo etheos --image-version build
